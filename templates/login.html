{% extends 'base.html' %}
{% block content %}



<!-- LOGIN SECTION (matching UI of signup form) -->
<section class="signup-section">
    <div class="form-card">  

        <h1>Welcome Back</h1>
        <p class="subtitle">Log in to continue using BIPSYNC</p>

        {% if error %}
            <p style="color:tomato; font-weight:600; margin-top:10px;">{{ error }}</p>
        {% endif %}

        <form class="signup-form" method="POST" action="/login">

            <label for="email">Email Address</label>
            <input type="email" id="email" name="email" placeholder="Enter your email" required>

            <label for="password">Password</label>
            <input type="password" id="password" name="password" placeholder="Enter your password" required>

            <button type="submit" class="primary-btn">Log In</button>
        </form>

        <p class="login-text">Don't have an account? 
            <a href="{{ url_for('signup') }}">Sign up</a>
        </p>
    </div>
</section>




    {% endblock %}
