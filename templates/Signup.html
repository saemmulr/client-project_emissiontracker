{% extends 'base.html' %}
{% block content %}


    <!-- SIGNUP SECTION -->
    <section class="signup-section fade-up">
        <div class="form-card">
            <h1>Create Your BIPSYNC Account</h1>
            <p>Fill in the details below to get started.</p>

            <form class="signup-form" method="POST" action="/signup">
    <label for="full-name">Full Name</label>
    <input type="text" id="name" name="full_name" placeholder="Enter your full name" required>

    <label for="email">Email Address</label>
    <input type="email" id="email" name="email" placeholder="Enter your email" required>

    <label for="dob">Date of Birth</label>
    <input type="date" id="dob" name="dob" required>

    <label for="address">Address</label>
    <input type="text" id="address" name="address" placeholder="Enter your address" required>

    <label for="phone">Phone Number</label>
    <input type="tel" id="phone" name="phone" placeholder="Enter your phone number" required>

    <label for="town">Town</label>
    <input type="text" id="town" name="town" placeholder="Enter your town" required>

    <label for="password">Create Password</label>
    <input type="password" id="password" name="password" placeholder="Create a password" required>

    <label for="confirm-password">Confirm Password</label>
    <input type="password" id="confirm-password" name="confirm_password" placeholder="Confirm your password" required>

    <button type="submit" class="primary-btn">Create Account</button>
</form>



            <p class="login-text">Already have an account? <a href="{{ url_for('login') }}">Log in</a></p>
        </div>
    </section>

{% endblock %}
